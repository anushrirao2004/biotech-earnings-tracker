name: biotech-tracker-scan

on:
  # No GitHub cron: cron-job.org dispatches this every two hours. Running both
  # made two scans overlap and the second failed pushing its state (2026-09-28).
  workflow_dispatch:
    inputs:
      only_tickers:
        description: "Limit to these tickers, comma-separated. Blank = all."
        required: false
        default: ""
      target_quarter:
        description: "Override the quarter, e.g. 3Q26. Blank = auto."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tracker-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scan press-release sources
        env:
          ONLY_TICKERS:   ${{ inputs.only_tickers }}
          TARGET_QUARTER: ${{ inputs.target_quarter }}
          # For the instant "results announced" alert only; the digest has its own job.
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan.py
      - name: Persist tracker
        run: |
          git config user.name  "biotech-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "tracker update [skip ci]"
          git pull --rebase
          git push
